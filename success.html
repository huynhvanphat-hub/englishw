<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Thành Công</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .success-content {
            text-align: center;
            padding: 40px 0;
        }
        .success-icon {
            color: var(--primary-color);
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 12px 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background-color: #E5E7EB;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="success-content">
            <svg class="success-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2C6.5 2 2 6.5 2 12C2 17.5 6.5 22 12 22Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7.75 12L10.58 14.83L16.25 9.17004" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1 class="form-title" style="margin-bottom: 12px;">Đăng ký Thành Công!</h1>
            <p class="form-subtitle">Cảm ơn bạn đã tham gia. Chúng tôi sẽ liên hệ với bạn trong thời gian sớm nhất.</p>
            
            <a href="index.html" class="back-btn">Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
